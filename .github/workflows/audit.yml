name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and sync locked environment
        run: |
          python3 -m pip install --user --disable-pip-version-check "uv==0.13.5"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          PATH="$(python3 -m site --user-base)/bin:$PATH"
          export PATH
          uv python install
          uv sync --locked

      - name: Audit dependencies
        run: make audit
